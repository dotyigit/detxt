name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Update npm (required for trusted publishing)
        run: npm i -g npm@11.5.1
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Verify tag matches package.json
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json','utf8')).version)")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi
      - name: Publish
        run: npm publish
